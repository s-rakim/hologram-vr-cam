[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hologram-vr-cam"
version = "0.2.0"
description = "DIY F1-style VR helmet (Raspberry Pi 5) and Ray-Ban-style camera glasses (ESP32-S3): CAD, firmware and software"
readme = "README.md"
authors = [{ name = "Malcolm Opondo" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# On Raspberry Pi OS install picamera2, gpiozero and pygame from apt (deploy/setup_pi5.sh).
pi = ["smbus2>=0.4", "gpiozero>=2.0", "pygame>=2.1", "pillow>=9"]
desktop = ["pygame>=2.1", "pillow>=9"]
dev = ["pytest>=7", "ifcopenshell>=0.8", "ruff>=0.6"]

[project.scripts]
hologram-vr = "hologram.vr.__main__:main"

[tool.setuptools]
packages = ["hologram", "hologram.vr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905", "E501"]          # zip(strict=...) noise; long data-table lines (BOM, wiring, geometry) read better unwrapped

[tool.ruff.lint.per-file-ignores]
# Runs inside Revit's IronPython 2.7: no f-strings, keeps py2-compatible idioms.
"cad/revit/*.py" = ["UP", "I", "E402"]
