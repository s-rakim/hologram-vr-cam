[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hologram-vr-cam"
version = "0.1.0"
description = "DIY VR display glasses with a Ray-Ban style POV camera (Raspberry Pi Zero 2 W)"
readme = "README.md"
authors = [{ name = "Malcolm Opondo" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# On Raspberry Pi OS install picamera2, gpiozero and pygame from apt (deploy/setup_pi.sh).
pi = ["smbus2>=0.4", "gpiozero>=2.0", "pygame>=2.1", "pillow>=9"]
desktop = ["pygame>=2.1", "pillow>=9"]
dev = ["pytest>=7", "ifcopenshell>=0.8"]

[project.scripts]
hologram = "hologram.__main__:main"

[tool.setuptools]
packages = ["hologram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
