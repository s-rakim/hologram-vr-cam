; Hologram Cam glasses firmware - Seeed Studio XIAO ESP32S3 Sense.
;   Build:  pio run
;   Flash:  pio run -t upload        (USB-C, before the board goes into the temple)
;   Later:  OTA over Wi-Fi sync mode (see docs/cam/assembly.md)

[env:xiao_esp32s3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
lib_deps =
    h2zero/NimBLE-Arduino@1.4.2
monitor_speed = 115200
