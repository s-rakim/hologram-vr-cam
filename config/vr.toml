# Hologram VR helmet settings. These are the built-in defaults (a test keeps them in sync);
# edit a copy, e.g. /etc/hologram/vr.toml, and pass it with --config.

[pins]                       # BCM GPIO numbers on the Pi 5 header (match docs/vr/wiring.md)
mode_button = 17             # tap = next mode, hold 2 s = power off
action_button = 27           # tap = next panorama / photo, hold = recentre
volume_down = 13
volume_up = 5
display_power = 22           # load switch on the display board's 5 V
imu_interrupt = 4

[display]
enabled = true
size = [2880, 1440]          # one HDMI signal: left half = left eye's panel
render_scale = 0.5           # render 720 x 720 per eye and scale up (raise if the Pi keeps up)
fps = 60
optics = "reflector"         # reflector (brow panels + visor mirrors) | lens
start_mode = "panorama"      # panorama | gallery | passthrough
motion_threshold_deg = 0.05  # a still view is not re-rendered
sleep_after_still_s = 60.0   # displays off when the helmet is put down
wake_threshold_deg = 2.0

# Brow panel -> ellipsoidal visor mirror -> eye. Lengths in mm, relative to the RIGHT eye
# (x outward); the left eye is the mirror image. Check the numbers with:
#     python3 -m hologram.vr optics --config /etc/hologram/vr.toml
[reflector]
ipd = 63.0
mirror_point = [14.0, 68.0, 8.0]   # centre of the mirror
focus = [16.0, 5.0, 75.0]          # the ellipsoid's second focus (above the eye)
image_distance_m = 1.5             # where the picture appears (sets how far the panel sits from the mirror)
display_mm = [52.1, 52.1]          # active area of one 2.9in 1440 x 1440 panel
left_roll_deg = 0.0                # calibration: one eye's picture slightly rotated (degrees; try the
right_roll_deg = 0.0               # other sign if it gets worse)
left_flip = [false, false]         # calibration: (x, y) if that eye's picture is mirrored / upside down
right_flip = [false, false]
nasal_clearance = 1.5
eye_relief_min = 25.0
forward_min = 20.0
mirror_az_deg = [-25.0, 55.0]      # the mirror's edges seen from the eye (azimuth + = outward)
mirror_el_deg = [-40.0, 36.0]      # ... and elevation (+ = up)

[lens]                       # only used with display.optics = "lens" (a panel behind a magnifier lens)
fov_deg = 90.0
k1 = 0.22
k2 = 0.24
lens_center_shift = 0.0
cant_deg = 0.0

[tracking]
enabled = true
i2c_bus = 1
address = 0x68
rate_hz = 200.0              # the MPU-6050 is set to 200 samples/s
beta = 0.05                  # Madgwick gain: higher = less drift, more jitter
calibration_samples = 400    # keep the helmet still for ~2 s at start-up
axis_map = ["x", "y", "z"]   # e.g. ["-y", "x", "z"] if the IMU board is mounted turned

[media]
panoramas = "~/Pictures/Hologram/360"   # 2:1 equirectangular photos; beach.wav beside beach.jpg plays around you
photos = "~/DCIM/Hologram"              # photos copied over from the Hologram Cam glasses
screen_width_m = 2.4
screen_distance_m = 2.0

[passthrough]
enabled = true
size = [1280, 720]
hfov_deg = 102.0             # Camera Module 3 Wide
zoom = 1.0                   # 1 = the room at its true size

[sound]
enabled = true
device = "plughw:CARD=sndrpihifiberry,DEV=0"   # the two I2S amps; list devices with: aplay -L
volume = 0.35
volume_step = 0.05
ear_pattern = 0.5            # virtual ear microphones: 1 = omni, 0.5 = cardioid, 0 = figure-of-eight

[thermal]
sensor_path = "/sys/class/thermal/thermal_zone0/temp"
throttle_c = 80.0            # halve the frame rate above this ...
resume_c = 70.0              # ... until the SoC cools below this

[power]
fuel_gauge = true            # the UPS board's fuel gauge on I2C
i2c_bus = 1
fuel_gauge_address = 0x36
warn_percent = 10.0
shutdown_percent = 3.0
shutdown_on_low_battery = true
